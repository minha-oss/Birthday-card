    background-repeat:repeat;
    background-size:220px 220px;
    font-family:'Georgia','Times New Roman',serif;
    color:var(--ink);
    overflow-x:hidden;
  }
  .scene{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:9vh 4vw 6vh;
    perspective:1900px;
  }

  /* ---------- COVER ---------- */
  #coverWrap{
    width:min(78vw,340px);
    cursor:pointer;
    text-align:center;
    animation:floatCover 4s ease-in-out infinite;
  }
  @keyframes floatCover{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-8px);}
  }
  #coverWrap img{
    width:100%;
    display:block;
    border-radius:6px;
    box-shadow:0 18px 40px rgba(40,10,5,.45), 0 2px 0 rgba(255,255,255,.15) inset;
    transition:transform .35s ease, box-shadow .35s ease;
  }
  #coverWrap:hover img{ transform:scale(1.015); box-shadow:0 22px 46px rgba(40,10,5,.55);}
  #coverWrap .hint{
    margin-top:14px;
    font-size:14px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:#6b4326;
    opacity:.85;
  }

  /* ---------- SPREAD ---------- */
  #spread{
    display:none;
    width:min(94vw,760px);
    gap:0;
    position:relative;
  }
  #spread.open .page-left{ transform:rotateY(0deg); }
  #spread.open .page-right{ transform:rotateY(0deg); }

  .page{
    flex:1 1 50%;
    aspect-ratio:700/978;
    position:relative;
    overflow:hidden;
    background:#1a1a1a;
    transition:transform .85s cubic-bezier(.22,.9,.28,1);
    box-shadow:0 20px 45px rgba(30,8,4,.4);
  }
  .page-left{
    transform-origin:right center;
    transform:rotateY(-92deg);
    border-radius:6px 0 0 6px;
  }
  .page-right{
    transform-origin:left center;
    transform:rotateY(92deg);
    border-radius:0 6px 6px 0;
  }
  .page img.fill{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block;
  }

  /* letter tuck / lift */
  .letter-layer{
    position:absolute;
    left:9%; right:9%; top:7%; bottom:7%;
    display:flex; align-items:center; justify-content:center;
    opacity:0;
    transform:scale(.82) translateY(14px) rotate(-1.5deg);
    transition:opacity .45s ease, transform .5s cubic-bezier(.2,.85,.3,1);
    pointer-events:none;
    z-index:3;
    cursor:pointer;
  }
  .letter-layer.shown{
    opacity:1;
    transform:scale(1) translateY(0) rotate(-.5deg);
    pointer-events:auto;
  }
  .letter-layer img{
    width:100%; height:100%; object-fit:contain;
    border-radius:3px;
    box-shadow:0 16px 34px rgba(20,5,0,.5);
    background:#f6f1e4;
  }
  .tuck-hint{
    position:absolute; left:0; right:0; bottom:4%;
    text-align:center; font-size:12px; letter-spacing:.08em;
    color:#fff3e6; text-shadow:0 1px 3px rgba(0,0,0,.6);
    z-index:2; pointer-events:none;
    text-transform:uppercase;
  }

  /* candles page */
  .flame{
    position:absolute;
    transform-origin:50% 100%;
    transition:opacity .5s ease, transform .35s ease;
    will-change:transform,opacity;
  }
  .flame img{ width:100%; height:100%; display:block; filter:drop-shadow(0 2px 5px rgba(0,0,0,.3)); }
  .flame.blowing{ animation:flameBend .13s ease-in-out infinite alternate; }
  @keyframes flameBend{
    0%{ transform:rotate(-16deg) translateX(-4%) scale(.97); }
    100%{ transform:rotate(12deg) translateX(4%) scale(1.03); }
  }
  .flame.out{
    opacity:0;
    transform:translateY(-10%) scale(.7) rotate(8deg);
  }

  .mic-wrap{
    position:absolute; left:8%; right:8%; bottom:6%;
    z-index:4;
    display:flex; flex-direction:column; align-items:center; gap:8px;
  }
  .mic-meter{
    width:100%; max-width:280px; height:10px;
    background:rgba(0,0,0,.28);
    border-radius:6px; overflow:hidden;
    box-shadow:inset 0 1px 3px rgba(0,0,0,.4);
  }
  .mic-fill{
    height:100%; width:0%;
    background:linear-gradient(90deg,#e0a84e,#c94c4a);
    transition:width .06s linear;
  }
  .mic-label{
    font-size:11px; letter-spacing:.06em; text-transform:uppercase;
    color:#4a2c14; background:rgba(255,247,232,.75); padding:3px 9px; border-radius:10px;
  }
  .fallback-btn{
    font-family:inherit; font-size:14px; padding:9px 18px;
    background:#a3251f; color:#fff8ee; border:none; border-radius:20px;
    cursor:pointer; box-shadow:0 6px 14px rgba(0,0,0,.3);
    user-select:none; -webkit-user-select:none; touch-action:none;
  }
  .fallback-btn:active{ background:#7d1a15; }
  .https-note{
    font-size:11px; color:#5c3a20; text-align:center; max-width:260px;
    opacity:.85; line-height:1.4;
  }

  .wish-overlay{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:16px;
    background:radial-gradient(circle at 50% 40%, rgba(255,246,230,.92), rgba(230,190,140,.85));
    opacity:0; pointer-events:none;
    transition:opacity .6s ease;
    text-align:center;
    padding:6%;
    z-index:6;
  }
  .wish-overlay.shown{ opacity:1; pointer-events:auto; }
  .wish-overlay h2{
    margin:0; font-size:clamp(22px,6vw,32px); color:#a3251f;
  }
  .wish-overlay p{ margin:0; font-size:14px; color:#5c3a20; max-width:240px; }
  .relight-btn{
    font-family:inherit; font-size:14px; padding:10px 20px;
    background:#3a2418; color:#f6efdf; border:none; border-radius:20px;
    cursor:pointer; box-shadow:0 6px 14px rgba(0,0,0,.3);
  }

  .close-btn{
    margin-top:22px;
    font-family:inherit; font-size:13px; letter-spacing:.08em; text-transform:uppercase;
    background:transparent; border:1px solid rgba(58,36,24,.5); color:var(--ink);
    padding:8px 18px; border-radius:18px; cursor:pointer;
    opacity:0; transition:opacity .5s ease .2s;
  }
  #spread.open ~ .close-btn, .close-btn.visible{ opacity:.85; }

  #confettiCanvas{
    position:fixed; inset:0; width:100%; height:100%;
    pointer-events:none; z-index:50;
  }

  @media (prefers-color-scheme: dark){
    html,body{ background-color:#3a2418; }
  }
</style>
</head>

    </div>
  </div>

  <button class="close-btn" id="closeBtn">← back to cover</button>
</div>

<canvas id="confettiCanvas"></canvas>

<script>
(function(){
  var coverWrap = document.getElementById('coverWrap');
  var spread = document.getElementById('spread');
  var closeBtn = document.getElementById('closeBtn');
  var pageLeft = document.getElementById('pageLeft');
  var letterLayer = document.getElementById('letterLayer');
  var tuckHint = document.getElementById('tuckHint');
  var flame1 = document.getElementById('flame1');
  var flame2 = document.getElementById('flame2');
  var micFill = document.getElementById('micFill');
  var micLabel = document.getElementById('micLabel');
  var fallbackBtn = document.getElementById('fallbackBtn');
  var httpsNote = document.getElementById('httpsNote');
  var wishOverlay = document.getElementById('wishOverlay');
  var relightBtn = document.getElementById('relightBtn');
  var confettiCanvas = document.getElementById('confettiCanvas');

  var isOpen = false;
  var lettersShown = false;
  var candlesOut = false;
  var micReady = false;
  var manualBlowing = false;
  var micBlowing = false;
  var blowAccum = 0;
  var lastTime = null;
  var audioCtx = null, analyser = null, dataArray = null, micStream = null;
  var rafId = null;

  var BLOW_THRESHOLD = 0.10;
  var BLOW_MS_NEEDED = 500;

  /* ---------- open / close ---------- */
  function openBook(){
    if(isOpen) return;
    isOpen = true;
    coverWrap.style.transition = 'opacity .4s ease, transform .4s ease';
    coverWrap.style.opacity = '0';
    coverWrap.style.transform = 'scale(.9) translateY(-6px)';
    setTimeout(function(){
      coverWrap.style.display = 'none';
      spread.style.display = 'flex';
      closeBtn.classList.add('visible');
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){
          spread.classList.add('open');
        });
      });
      initMicIfNeeded();
    }, 380);
  }

  function closeBook(){
    if(!isOpen) return;
    isOpen = false;
    spread.classList.remove('open');
    closeBtn.classList.remove('visible');
    setTimeout(function(){
      spread.style.display = 'none';
      coverWrap.style.display = 'block';
      requestAnimationFrame(function(){
        coverWrap.style.opacity = '1';
        coverWrap.style.transform = 'scale(1) translateY(0)';
      });
    }, 850);
  }

  coverWrap.addEventListener('click', openBook);
  closeBtn.addEventListener('click', closeBook);

  /* ---------- letter tuck / lift ---------- */
  function toggleLetter(){
    lettersShown = !lettersShown;
    letterLayer.classList.toggle('shown', lettersShown);
    tuckHint.style.opacity = lettersShown ? '0' : '1';
  }
  pageLeft.addEventListener('click', function(e){
    toggleLetter();
  });

  /* ---------- confetti ---------- */
  var ctx = confettiCanvas.getContext('2d');
  var confettiParticles = [];
  var confettiRunning = false;
  function resizeCanvas(){
    confettiCanvas.width = window.innerWidth;
    confettiCanvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  var confettiColors = ['#c94c4a','#e0a84e','#f6efdf','#a3251f','#8a5a2b','#f0c04a'];
  function launchConfetti(){
    confettiParticles = [];
    var count = 110;
    for(var i=0;i<count;i++){
      confettiParticles.push({
        x: Math.random()*confettiCanvas.width,
        y: -20 - Math.random()*confettiCanvas.height*0.4,
        w: 6+Math.random()*6,
        h: 8+Math.random()*10,
        color: confettiColors[Math.floor(Math.random()*confettiColors.length)],
        rot: Math.random()*Math.PI*2,
        vRot: (Math.random()-0.5)*0.2,
        vy: 2+Math.random()*3,
        vx: (Math.random()-0.5)*2,
        life: 0,
        maxLife: 220+Math.random()*80
      });
    }
    confettiRunning = true;
    requestAnimationFrame(confettiTick);
  }
  function confettiTick(){
    if(!confettiRunning) return;
    ctx.clearRect(0,0,confettiCanvas.width, confettiCanvas.height);
    var alive = false;
    for(var i=0;i<confettiParticles.length;i++){
      var p = confettiParticles[i];
      if(p.life > p.maxLife) continue;
      p.life++;
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.02;
      p.rot += p.vRot;
      var fade = 1;
      if(p.life > p.maxLife - 40) fade = Math.max(0,(p.maxLife-p.life)/40);
      if(p.y < confettiCanvas.height+30){ alive = true; }
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha = fade;
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      ctx.restore();
    }
    if(alive){
      requestAnimationFrame(confettiTick);
    } else {
      confettiRunning = false;
      ctx.clearRect(0,0,confettiCanvas.width, confettiCanvas.height);
    }
  }

  /* ---------- candles ---------- */
  function extinguishCandles(){
    if(candlesOut) return;
    candlesOut = true;
    flame1.classList.remove('blowing');
    flame2.classList.remove('blowing');
    flame1.classList.add('out');
    flame2.classList.add('out');
    setTimeout(function(){
      wishOverlay.classList.add('shown');
      launchConfetti();
    }, 350);
  }

  function relightCandles(){
    candlesOut = false;
    blowAccum = 0;
    flame1.classList.remove('out');
    flame2.classList.remove('out');
    wishOverlay.classList.remove('shown');
    confettiRunning = false;
    ctx.clearRect(0,0,confettiCanvas.width, confettiCanvas.height);
  }
  relightBtn.addEventListener('click', relightCandles);

  /* ---------- mic detection ---------- */
  function isSecureEnough(){
    return location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
  }

  function initMicIfNeeded(){
    if(micReady || candlesOut) return;
    if(!isSecureEnough() || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      httpsNote.style.display = 'block';
      micLabel.textContent = 'mic unavailable — use the button below';
      return;
    }
    navigator.mediaDevices.getUserMedia({audio:true, video:false})
      .then(function(stream){
        micStream = stream;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        var source = audioCtx.createMediaStreamSource(stream);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 512;
        dataArray = new Uint8Array(analyser.fftSize);
        source.connect(analyser);
        micReady = true;
        micLabel.textContent = 'blow into the mic';
        if(!rafId) rafId = requestAnimationFrame(loop);
      })
      .catch(function(err){
        httpsNote.style.display = 'block';
        micLabel.textContent = 'mic blocked — use the button below';
      });
  }

  function getMicLevel(){
    if(!analyser) return 0;
    analyser.getByteTimeDomainData(dataArray);
    var sumSq = 0;
    for(var i=0;i<dataArray.length;i++){
      var v = (dataArray[i]-128)/128;
      sumSq += v*v;
    }
    return Math.sqrt(sumSq/dataArray.length);
  }

  function loop(timestamp){
    rafId = requestAnimationFrame(loop);
    if(lastTime === null) lastTime = timestamp;
    var dt = timestamp - lastTime;
    lastTime = timestamp;

    var level = 0;
    if(micReady) level = getMicLevel();
    micBlowing = level > BLOW_THRESHOLD;

    var displayLevel = manualBlowing ? Math.max(level, 0.55) : level;
    var pct = Math.min(100, displayLevel / 0.5 * 100);
    micFill.style.width = pct + '%';

    var blowingNow = (micBlowing || manualBlowing) && !candlesOut;

    if(blowingNow){
      flame1.classList.add('blowing');
      flame2.classList.add('blowing');
      blowAccum += dt;
      if(blowAccum >= BLOW_MS_NEEDED){
        extinguishCandles();
      }
    } else {
      flame1.classList.remove('blowing');
      flame2.classList.remove('blowing');
      blowAccum = Math.max(0, blowAccum - dt*2);
    }
  }
  if(!rafId) rafId = requestAnimationFrame(loop);

  /* fallback hold-to-blow */
  function startManual(e){
    if(e) e.preventDefault();
    manualBlowing = true;
  }
  function stopManual(e){
    manualBlowing = false;
  }
  fallbackBtn.addEventListener('mousedown', startManual);
  fallbackBtn.addEventListener('touchstart', startManual, {passive:false});
  fallbackBtn.addEventListener('mouseup', stopManual);
  fallbackBtn.addEventListener('mouseleave', stopManual);
  fallbackBtn.addEventListener('touchend', stopManual);
  fallbackBtn.addEventListener('touchcancel', stopManual);

  window.addEventListener('keydown', function(e){
    if(e.code === 'Space' && isOpen){
      e.preventDefault();
      manualBlowing = true;
    }
  });
  window.addEventListener('keyup', function(e){
    if(e.code === 'Space'){
      manualBlowing = false;
    }
  });

})();
</script>
</body>
</html>
